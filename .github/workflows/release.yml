name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            name: linux-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The version comes from rust-toolchain.toml, the same one mars and orbit use.
      - name: Install Rust
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools (ARM64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Install ONNX Runtime 1.22 (Linux, pinned by hash, dynamic link)
        if: runner.os == 'Linux'
        run: |
          # The runtime comes from our own 5.1.5 release, and must match the hash we
          # have shipped since 5.0.11. Until 5.1.6 it was fetched from
          # github.com/microsoft/onnxruntime with no check; that repository went
          # offline on 17 Nov 2026, and a file that returns under the same name
          # must not be shipped unseen.
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            ORT_FROM="geniuz-linux-arm64.tar.gz"
            ORT_SHA256="0afd69a0ae38c5099fd0e8604dda398ac43dee67cd9c6394b5142b19e82528de"
          else
            ORT_FROM="geniuz-linux-amd64.tar.gz"
            ORT_SHA256="3da6146e14e7b8aaec625dde11d6114c7457c87a5f93d744897da8781e35c673"
          fi
          mkdir -p /tmp/ort && cd /tmp/ort
          curl -fsSL -o from.tar.gz "https://github.com/jackccrawford/Geniuz/releases/download/v5.1.5/${ORT_FROM}"
          tar xzf from.tar.gz libonnxruntime.so.1.22.0
          echo "${ORT_SHA256}  libonnxruntime.so.1.22.0" | sha256sum -c -
          sudo cp libonnxruntime.so.1.22.0 /usr/local/lib/
          sudo ln -sf libonnxruntime.so.1.22.0 /usr/local/lib/libonnxruntime.so
          sudo ln -sf libonnxruntime.so.1.22.0 /usr/local/lib/libonnxruntime.so.1
          sudo ldconfig
          echo "ORT_LIB_LOCATION=/usr/local/lib" >> $GITHUB_ENV
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> $GITHUB_ENV

      - name: Build
        run: |
          # Linux: an rpath of $ORIGIN/../lib, so the system's loader finds the
          # bundled ONNX Runtime beside the program even when it is started
          # without the launcher script. install.sh still installs the launcher.
          if [ "${{ runner.os }}" = "Linux" ]; then
            export RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN/../lib'
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package and checksum
        run: |
          cd target/${{ matrix.target }}/release
          # Bundle ORT shared library for Linux (dynamic linking)
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp /usr/local/lib/libonnxruntime.so.1.22.0 .
            # geniuz-embed is the helper that can keep the search model loaded, as the
            # Windows installer already ships. It runs only for someone who sets
            # GENIUZ_EMBED_SPAWN=1; a keep then takes 0.2 s where it took 1.65 s
            # (explora, 17 Nov 2026). install.sh installs it when it is here.
            tar czf ../../../geniuz-${{ matrix.name }}.tar.gz geniuz geniuz-embed libonnxruntime.so.1.22.0
          else
            tar czf ../../../geniuz-${{ matrix.name }}.tar.gz geniuz
          fi
          cd ../../..
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum geniuz-${{ matrix.name }}.tar.gz > geniuz-${{ matrix.name }}.tar.gz.sha256
          else
            shasum -a 256 geniuz-${{ matrix.name }}.tar.gz > geniuz-${{ matrix.name }}.tar.gz.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geniuz-${{ matrix.name }}
          path: |
            geniuz-${{ matrix.name }}.tar.gz
            geniuz-${{ matrix.name }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            geniuz-*.tar.gz
            geniuz-*.tar.gz.sha256
          generate_release_notes: true
          # A tag like v5.0.0-rc.1 is a pre-release: "latest" and every download link stay put.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
