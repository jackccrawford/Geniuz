[package]
name = "geniuz"
version = "5.1.2"
edition = "2021"
description = "Your AI remembers now — persistent memory for AI agents"
license = "MIT"
repository = "https://github.com/jackccrawford/geniuz"
homepage = "https://agentdoor.ai/geniuz"
readme = "README.md"
keywords = ["mcp", "memory", "ai-agents", "semantic-search", "claude"]
categories = ["command-line-utilities", "database"]
# Keep the published crate lean: ship source only, not release binaries,
# the Tauri desktop app, installers, or screenshots.
exclude = [
    "release-artifacts/",
    "desktop/",
    "installer/",
    "images/",
    "*.AppImage", "*.deb", "*.rpm", "*.dmg", "*.exe",
]

[lib]
name = "geniuz"
path = "src/lib.rs"

[[bin]]
name = "geniuz"
path = "src/main.rs"

[[bin]]
name = "geniuz-embed"
path = "src/embed_server.rs"

[build-dependencies]
# Embed a Windows VersionInfo resource so Task Manager shows "Geniuz"
# instead of "geniuz.exe". Only runs on Windows builds; no-op
# on Mac/Linux. Compile-time only; not in the shipped binary.
winresource = "0.1"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }  # pinned: SQLite 3.46, the fleet's engine (relay, Team, kith); 3.45 shifted datetime('now','utc') by the local offset
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "5"

# Embedding: built-in ONNX inference for semantic search
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "api-17", "download-binaries", "copy-dylibs", "tls-native"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ureq = { version = "3", features = ["json"] }
interprocess = "2"

# TUI: ratatui + crossterm for `geniuz tui`
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"

# Images kept with memories: `image` reads what comes in and downscales it; `webp`
# (Google's libwebp, compiled in as SQLite is) writes lossy WebP, which the
# pure-Rust encoder can't. Measured 10 Nov 2026: about 1 MB added.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
webp = { version = "0.3", default-features = false }
sha2 = "0.10"
base64 = "0.22"

# Tray — feature-gated, Windows only ship. Tooltip + right-click menu only,
# no GUI window, no webview. Keeps binary small (~3MB vs ~7MB with eframe).

[dev-dependencies]
tempfile = "3"
